# Corpo (não header) carrega o texto "cloudflare" -- nginx não deixa
# sobrescrever o header Server embutido sem um módulo extra
# (headers-more), e o sinal de classificação olha header+corpo juntos
# (ver probe.py's _parse_http_signal), então o corpo já é suficiente pra
# exercitar o caminho real de leitura HTTP sobre um socket de verdade.
server {
    listen 80;
    location / {
        return 200 "blocked by cloudflare edge";
    }
}
