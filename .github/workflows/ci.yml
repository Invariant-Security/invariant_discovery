# Sem Postgres -- este serviço não toca banco (ver api.py). Sobe os 3
# containers de fixture reais (sshd/http-waf-like/silent-port), roda a
# suíte inteira (unitários + integração de socket real) e derruba.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Mesmo lock da imagem (Dockerfile); só as ferramentas de teste
      # (extra `dev`) continuam sem pin.
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - run: pip install --no-deps -e . && pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx2

      - name: Build and start the fixture containers
        run: docker compose -f tests/fixtures/docker-compose.yml up -d --build --wait --wait-timeout 120

      - run: pytest tests/ -q
        env:
          INVARIANT_ENVIRONMENT: ci
          INVARIANT_ALLOW_LOOPBACK_TARGETS: "1"

      - name: Logs on failure
        if: failure()
        run: docker compose -f tests/fixtures/docker-compose.yml logs --tail=80 || true

      - name: Tear down
        if: always()
        run: docker compose -f tests/fixtures/docker-compose.yml down -v || true
