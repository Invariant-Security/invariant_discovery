# Net-new capacidade de CI, ver o mesmo comentário em invariant_api's
# publish-image.yml -- publica a imagem que docker-compose.appliance.yml
# referencia via `image:`.
#
# Dois caminhos:
#  - push de tag v*: tags da versão e `latest` (como sempre).
#  - workflow_run do `ci` em dev/main: uma imagem por commit, tag
#    <branch>-<sha>, construída aqui no GitHub (nunca na VPS) para o k8s
#    puxar por digest. Mesmas travas dos deploy*.yml.
# Atenção: o GitHub usa a versão DESTE arquivo que está na branch padrão
# (main) para o gatilho workflow_run.
name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: read
  packages: write

# workflow_run roda com github.ref = branch padrão: sem o head_sha, publicações de
# dev e main dividiriam o grupo e uma pendente seria descartada.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ github.event_name == 'workflow_run' && format('ghcr.io/invariant-security/invariant-discovery:{0}-{1}', github.event.workflow_run.head_branch, github.event.workflow_run.head_sha) || format('ghcr.io/invariant-security/invariant-discovery:{0}', github.ref_name) }}
            ${{ github.event_name != 'workflow_run' && 'ghcr.io/invariant-security/invariant-discovery:latest' || '' }}
      - run: echo "ghcr.io/invariant-security/invariant-discovery@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
