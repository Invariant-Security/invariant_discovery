# Roda no runner self-hosted dedicado deste repo (registrado direto nele,
# não a nível de organização -- mesmo padrão já usado pelos outros
# projetos desta VPS). Atualiza SÓ o container `discovery` na stack
# compartilhada `invariant-next` (definida em invariant_api's
# docker-compose.yml) -- api/assessment/ingestion/web nem percebem.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-invariant-discovery
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, vps-prod]
    env:
      SRC_DIR: /srv/projects/publicado/invariant/prod/invariant_discovery
      STACK_DIR: /srv/projects/publicado/invariant/prod/invariant_api
    steps:
      - name: Atualizar código
        run: |
          git config --global --add safe.directory "$SRC_DIR"
          cd "$SRC_DIR"
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir e subir só este serviço
        run: |
          cd "$STACK_DIR"
          docker compose up -d --build --wait --wait-timeout 180 discovery

      - name: Logs em caso de falha
        if: failure()
        run: |
          cd "$STACK_DIR"
          docker compose logs --tail=80 discovery || true
