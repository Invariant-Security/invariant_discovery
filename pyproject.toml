[project]
name = "invariant_discovery"
version = "0.1.0"
description = "Fingerprints network endpoints (IP/CIDR) as windows/linux/docker/waf/firewall/vmware/unknown -- lightweight socket probing, no nmap, no Postgres access."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]
# ponytail: invariant_contracts is NOT a dependency here on purpose, same
# reasoning as invariant_assessment's pyproject.toml -- this service only
# ever constructs its own local DiscoveryResultItem (api.py), invariant_api
# is the only place a real invariant_contracts.DiscoveryResult gets built.

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx2"]

[tool.pytest.ini_options]
markers = [
    "integration: hits real listening sockets (test fixture containers) instead of synthetic evidence dicts",
]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_discovery"]
